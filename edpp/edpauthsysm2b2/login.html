<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Log In</title>
  </head>
  <body class="m-auto flex items-center justify-center min-h-screen bg-gray-200">
    <form
      id="loginForm"
      class="w-[350px] bg-white shadow-lg border border-slate-400 flex flex-col items-center justify-center gap-3 py-8 px-6 rounded-md"
    >
      <p class="text-2xl mb-3 text-slate-600 font-bold">Welcome Back</p>

      <!-- email -->
      <div class="flex flex-col gap-1 w-full">
        <label class="text-sm text-slate-700">Email Address</label>
        <input
          type="email"
          name="email"
          id="email"
          class="w-full h-[38px] bg-white border border-slate-400 rounded-lg px-3 text-sm"
          placeholder="Enter your email"
        />
        <span id="emailError" class="text-red-500 text-xs italic"></span>
      </div>

      <!-- password -->
      <div class="flex flex-col gap-1 w-full">
        <label class="text-sm text-slate-700">Password</label>
        <input
          type="password"
          name="password"
          id="password"
          class="w-full h-[38px] bg-white border border-slate-400 rounded-lg px-3 text-sm"
          placeholder="Enter your password"
        />
        <span id="passwordError" class="text-red-500 text-xs italic"></span>
      </div>

      <!-- general message -->
      <span id="formMessage" class="text-sm italic mt-1"></span>

      <button
        type="submit"
        class="w-full h-[38px] bg-slate-700 text-white rounded-lg mt-3 text-sm hover:bg-slate-800"
      >
        Log In
      </button>

      <p class="text-sm text-slate-500 mt-1">
        Don't have an account?
        <a href="signup.html" class="text-blue-500 hover:underline">Sign up</a>
      </p>
    </form>

    <script type="module">
      import { login, getCurrentUser } from "./auth.js";

      // redirect if already logged in
      if (getCurrentUser()) {
        window.location.href = "home.html";
      }

      // main state
      let state = {
        email: "",
        password: "",
      };

      // state mutation
      function setState(newState) {
        state = { ...state, ...newState };
        render();
      }

      // event listeners on each input
      document
        .querySelectorAll("#loginForm input")
        .forEach((input) => input.addEventListener("input", handleInput));

      function handleInput(event) {
        const { name, value } = event.target;
        setState({ [name]: value });
      }

      // render: validate and update error messages
      function render() {
        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");

        if (state.email === "") {
          emailError.textContent = "Email is required!";
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email)) {
          emailError.textContent = "Invalid email format!";
        } else {
          emailError.textContent = "";
        }

        passwordError.textContent =
          state.password === "" ? "Password is required!" : "";
      }

      // form submission
      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();

        render();

        const emailError = document.getElementById("emailError");
        const passwordError = document.getElementById("passwordError");
        const formMessage = document.getElementById("formMessage");

        if (emailError.textContent || passwordError.textContent) {
          return;
        }

        const result = login(state);

        if (!result.success) {
          formMessage.textContent = result.message;
          formMessage.className = "text-red-500 text-sm italic mt-1";
          return;
        }

        formMessage.textContent = result.message + " Redirecting...";
        formMessage.className = "text-green-600 text-sm italic mt-1";

        setTimeout(() => {
          window.location.href = "home.html";
        }, 1000);
      });
    </script>
  </body>
</html>
