<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Home</title>
  </head>
  <body class="m-auto flex items-center justify-center min-h-screen bg-gray-200">
    <div
      id="userCard"
      class="w-[380px] bg-white shadow-lg border border-slate-400 flex flex-col items-center justify-center gap-4 py-10 px-8 rounded-md"
    >
      <div class="w-16 h-16 rounded-full bg-slate-700 flex items-center justify-center text-white text-2xl font-bold" id="avatarInitial">
        ?
      </div>

      <p class="text-2xl text-slate-700 font-bold">Welcome!</p>

      <div class="w-full bg-gray-100 rounded-lg p-4 flex flex-col gap-2 text-sm text-slate-600">
        <div class="flex justify-between">
          <span class="font-semibold text-slate-500">Username</span>
          <span id="displayUsername" class="text-slate-800">—</span>
        </div>
        <div class="flex justify-between">
          <span class="font-semibold text-slate-500">Email</span>
          <span id="displayEmail" class="text-slate-800">—</span>
        </div>
      </div>

      <button
        id="logoutBtn"
        class="w-full h-[38px] bg-red-500 text-white rounded-lg text-sm hover:bg-red-600 mt-2"
      >
        Log Out
      </button>
    </div>

    <script type="module">
      import { getCurrentUser, logout } from "./auth.js";

      // guard: redirect to login if not authenticated
      const currentUser = getCurrentUser();
      if (!currentUser) {
        window.location.href = "login.html";
      } else {
        // render user details from global state (localStorage)
        document.getElementById("displayUsername").textContent = currentUser.username;
        document.getElementById("displayEmail").textContent = currentUser.email;

        // show first letter of username as avatar initial
        document.getElementById("avatarInitial").textContent =
          currentUser.username.charAt(0).toUpperCase();
      }

      // logout handler
      document.getElementById("logoutBtn").addEventListener("click", function () {
        logout();
        window.location.href = "login.html";
      });
    </script>
  </body>
</html>
