<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome</title>
  <script defer src="script.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
  
  <div class="bg-white rounded-xl shadow-lg p-8 w-96 text-center space-y-6">
    <h1 class="text-3xl font-bold">Welcome</h1>
    
    <div class="flex justify-center space-x-4">
      <button id="signupBtn" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-6 rounded">
        Sign Up
      </button>
      <button id="signinBtn" class="bg-red-500 hover:bg-red-600 text-white py-2 px-6 rounded">
        Sign In
      </button>
    </div>
  </div>

  <script>
    document.getElementById('signupBtn').addEventListener('click', () => {
      window.location.href = 'signup.html';
    });
    document.getElementById('signinBtn').addEventListener('click', () => {
      window.location.href = 'signin.html';
    });
  </script>
</body>
</html>
