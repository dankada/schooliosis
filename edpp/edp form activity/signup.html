<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script defer src="script.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

  <div class="bg-white rounded-xl shadow-lg p-8 w-96 space-y-6">
    <h1 class="text-2xl font-bold text-center">Sign Up</h1>
    
    <form id="signupForm" class="space-y-4">
      <div>
        <label>Email</label>
        <input type="email" id="signupEmail" class="w-full border rounded px-2 py-1">
        <p id="signupEmailError" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label>Phone</label>
        <input type="text" id="signupPhone" class="w-full border rounded px-2 py-1">
        <p id="signupPhoneError" class="text-red-500 text-sm"></p>
      </div>

      <div>
        <label>Password</label>
        <input type="password" id="signupPassword" class="w-full border rounded px-2 py-1">
        <p id="signupPasswordError" class="text-red-500 text-sm"></p>
      </div>

      <div class="flex justify-center space-x-4">
        <button type="submit" class="bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded">
          Sign Up
        </button>
        <button type="button" id="goBackBtn" class="bg-gray-400 hover:bg-gray-500 text-white py-2 px-4 rounded">
          Go Back
        </button>
      </div>
    </form>
  </div>

  <script>
    // Go Back button
    document.getElementById('goBackBtn').addEventListener('click', () => {
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
