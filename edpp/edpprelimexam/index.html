<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="gradient-background">
        <div class="mainbg">
            <div class="app-container">
                <h1>My To-Do List</h1>                
                <form id="todo-form">
                    
                    <div class="input-group">
                        <input type="text" id="task-input" placeholder="Enter a new task..." autocomplete="off">

                        <button type="submit" class="add-btn">
                            <span>+</span> Add Task
                        </button>
                    </div>
                    <div id="error-message" class="error-message hidden">Please enter a task!</div>
                </form>
                
                <ul id="task-list" class="task-list">
                </ul>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
